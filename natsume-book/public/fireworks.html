<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fireworks</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at bottom, #10142a 0%, #05060d 60%, #000 100%);
    }
    canvas { display: block; }
    .tip {
      position: fixed;
      left: 12px;
      top: 10px;
      color: #fff;
      font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      opacity: 0.8;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="tip">点击放烟花（圆环/爱心/星星/螺旋等多图案，含音效）</div>
  <canvas id="c"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    let w, h;

    const particles = [];
    const rockets = [];
    const trails = [];

    let audioCtx = null;
    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    }

    function playLaunchSound() {
      const ctxA = ensureAudio();
      const now = ctxA.currentTime;
      const osc = ctxA.createOscillator();
      const gain = ctxA.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.exponentialRampToValueAtTime(520, now + 0.12);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.08, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
      osc.connect(gain).connect(ctxA.destination);
      osc.start(now);
      osc.stop(now + 0.15);
    }

    function playExplosionSound() {
      const ctxA = ensureAudio();
      const now = ctxA.currentTime;

      const bufferSize = ctxA.sampleRate * 0.4;
      const buffer = ctxA.createBuffer(1, bufferSize, ctxA.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }

      const noise = ctxA.createBufferSource();
      const filter = ctxA.createBiquadFilter();
      const gain = ctxA.createGain();
      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1600, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.24, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
      noise.buffer = buffer;
      noise.connect(filter).connect(gain).connect(ctxA.destination);
      noise.start(now);
      noise.stop(now + 0.41);

      // secondary crackle layer for more realistic burst
      const crack = ctxA.createOscillator();
      const crackGain = ctxA.createGain();
      crack.type = "triangle";
      crack.frequency.setValueAtTime(rand(120, 180), now);
      crack.frequency.exponentialRampToValueAtTime(rand(40, 70), now + 0.22);
      crackGain.gain.setValueAtTime(0.0001, now + 0.01);
      crackGain.gain.exponentialRampToValueAtTime(0.07, now + 0.04);
      crackGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.24);
      crack.connect(crackGain).connect(ctxA.destination);
      crack.start(now + 0.01);
      crack.stop(now + 0.25);
    }

    function resize() {
      w = canvas.width = window.innerWidth * devicePixelRatio;
      h = canvas.height = window.innerHeight * devicePixelRatio;
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    function rand(min, max) { return Math.random() * (max - min) + min; }

    class Trail {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.life = 20;
        this.color = color;
      }
      update() { this.life--; }
      draw() {
        const a = Math.max(this.life / 20, 0);
        ctx.globalAlpha = a;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.6, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      get dead() { return this.life <= 0; }
    }

    class Rocket {
      constructor(x, targetY) {
        this.x = x;
        this.y = window.innerHeight;
        this.vx = rand(-0.8, 0.8);
        this.vy = rand(-12, -9);
        this.targetY = targetY;
        this.color = `hsl(${rand(0,360)},100%,65%)`;
        this.shape = ["burst", "ring", "heart", "star", "doubleRing", "spiral", "willow", "starburst"][Math.floor(rand(0, 8))];
        this.done = false;
      }
      update() {
        trails.push(new Trail(this.x, this.y, this.color));
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.08;
        if (this.y <= this.targetY || this.vy > -1) {
          this.explode();
          this.done = true;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      explode() {
        playExplosionSound();
        const count = Math.floor(rand(70, 130));
        const hue = rand(0, 360);

        if (this.shape === "ring") {
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const speed = rand(3.2, 5.2);
            particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, `hsl(${hue + rand(-12,12)},100%,${rand(52,72)}%)`));
          }
        } else if (this.shape === "doubleRing") {
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const speed = i % 2 === 0 ? rand(2.2, 3.2) : rand(4.8, 6.2);
            particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, `hsl(${hue + rand(-18,18)},100%,${rand(52,74)}%)`));
          }
        } else if (this.shape === "heart") {
          for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 2;
            const sx = 16 * Math.pow(Math.sin(t), 3);
            const sy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            const scale = rand(0.18, 0.24);
            particles.push(new Particle(this.x, this.y, sx * scale, sy * scale, `hsl(${hue + rand(-8,8)},100%,${rand(55,75)}%)`));
          }
        } else if (this.shape === "star" || this.shape === "starburst") {
          for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const spikes = this.shape === "starburst" ? 8 : 5;
            const spike = Math.abs(Math.cos(spikes * angle));
            const speed = 1.4 + spike * rand(4.2, 6.4);
            particles.push(new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed, `hsl(${hue + rand(-20,20)},100%,${rand(50,74)}%)`));
          }
        } else if (this.shape === "spiral") {
          for (let i = 0; i < count; i++) {
            const t = (i / count) * Math.PI * 6;
            const speed = 0.7 + (i / count) * 5.5;
            particles.push(new Particle(this.x, this.y, Math.cos(t) * speed, Math.sin(t) * speed, `hsl(${hue + i * 0.8},100%,${rand(50,72)}%)`));
          }
        } else if (this.shape === "willow") {
          for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(1.2, 4.5);
            const p = new Particle(this.x, this.y, Math.cos(angle) * speed, Math.sin(angle) * speed * 0.55, `hsl(${hue + rand(-14,14)},100%,${rand(58,78)}%)`);
            p.life = rand(80, 130);
            p.maxLife = p.life;
            particles.push(p);
          }
        } else {
          for (let i = 0; i < count; i++) {
            const angle = rand(0, Math.PI * 2);
            const speed = rand(1.2, 6.4);
            particles.push(new Particle(
              this.x, this.y,
              Math.cos(angle) * speed,
              Math.sin(angle) * speed,
              `hsl(${hue + rand(-22,22)},100%,${rand(48,72)}%)`
            ));
          }
        }

        // glitter layer for sparkle effect
        const sparkCount = Math.floor(rand(20, 45));
        for (let i = 0; i < sparkCount; i++) {
          const angle = rand(0, Math.PI * 2);
          const speed = rand(0.6, 3.6);
          particles.push(new Particle(
            this.x, this.y,
            Math.cos(angle) * speed,
            Math.sin(angle) * speed,
            `hsl(${hue + rand(-10,10)},100%,85%)`,
            true
          ));
        }
      }
    }

    class Particle {
      constructor(x, y, vx, vy, color, spark = false) {
        this.x = x; this.y = y;
        this.vx = vx; this.vy = vy;
        this.life = spark ? rand(25, 50) : rand(55, 95);
        this.maxLife = this.life;
        this.alpha = 1;
        this.color = color;
        this.size = spark ? rand(0.8, 1.8) : rand(1.4, 3.1);
        this.spark = spark;
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += this.spark ? 0.03 : 0.05;
        this.vx *= 0.988;
        this.vy *= 0.988;
        this.life--;
        this.alpha = Math.max(this.life / this.maxLife, 0);
      }
      draw() {
        const flicker = this.spark ? rand(0.4, 1) : rand(0.75, 1);
        ctx.globalAlpha = this.alpha * flicker;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      get dead() { return this.life <= 0; }
    }

    function launch(x = rand(80, window.innerWidth - 80), y = rand(100, window.innerHeight * 0.55)) {
      playLaunchSound();
      rockets.push(new Rocket(x, y));
    }

    window.addEventListener("click", (e) => launch(e.clientX, e.clientY));
    setInterval(() => launch(), 700);

    function drawFestivalText() {
      const t = performance.now() * 0.001;
      const glow = 0.65 + Math.sin(t * 2.2) * 0.2;
      const text = "🐴 马年快乐 🧧";
      ctx.save();
      ctx.textAlign = "center";
      ctx.font = "bold 42px system-ui, -apple-system, Segoe UI, sans-serif";
      ctx.shadowBlur = 24;
      ctx.shadowColor = `rgba(255,180,80,${glow})`;
      ctx.fillStyle = "rgba(255,230,170,0.95)";
      ctx.fillText(text, window.innerWidth / 2, 74);
      ctx.restore();
    }

    function animate() {
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
      drawFestivalText();

      for (let i = trails.length - 1; i >= 0; i--) {
        trails[i].update();
        trails[i].draw();
        if (trails[i].dead) trails.splice(i, 1);
      }

      for (let i = rockets.length - 1; i >= 0; i--) {
        rockets[i].update();
        rockets[i].draw();
        if (rockets[i].done) rockets.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].dead) particles.splice(i, 1);
      }

      requestAnimationFrame(animate);
    }
    animate();
  </script>
</body>
</html>
